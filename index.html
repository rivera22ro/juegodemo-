<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cazador de energía</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Cazador de energía</h1>

    <p>Usa las flechas del teclado o los controles táctiles para moverte.</p>

    <div id="marcador">Cristales recogidos: 0</div>
    
    
    <div id="contenedorEnergia">
    <div id="barraEnergia"></div>
</div>

    <div id="textoVida">Vida: 100 / 100</div>

    <div id="contenedorVida">
    <div id="barraVida"></div>
</div>


    <canvas id="juego" width="800" height="500"></canvas>

    <div id="controlesTactiles" aria-label="Controles táctiles del juego">
        <div id="joystick" aria-label="Joystick para moverse">
            <div class="flecha flecha-arriba">▲</div>
            <div class="flecha flecha-abajo">▼</div>
            <div class="flecha flecha-izquierda">◀</div>
            <div class="flecha flecha-derecha">▶</div>
            <div id="joystickNucleo"></div>
        </div>
        <button id="botonDisparo" type="button" aria-label="Disparar">⚡</button>
    </div>

    <p id="mensaje">¡Recoge cristales y derrota a los enemigos!</p>

    <button id="reiniciar">Volver a jugar</button>

    <script src="juego.js"></script>
</body>
</html>
